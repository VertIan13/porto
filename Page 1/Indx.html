<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My photos</title>
    <link rel="stylesheet" href="styles.css">
    </head>
<body>

    <header>
        <div class="container">
            <h1 class="logo">Taken By Repal</h1>
            <div class="search-icon">🔍</div>
        </div>
    </header>

    <main>
        <section class="hero-banner">
            <img src="path/to/hero-image.jpg" alt="Pria dengan baju merah menghadap ke stasiun">
        </section>

        <section class="gallery-intro">
            <div class="container">
                <p class="subtitle">Photography</p>
                <h2 class="section-title">MY PHOTOGRAPHY GALLERY</h2>
            </div>
        </section>

        <section class="gallery">
            <div class="container">
                
                <div class="row row-3">
                    <img src="img/1.jpg" alt="Deskripsi foto 1">
                    <img src="img/2.jpg" alt="Deskripsi foto 2">
                    <img src="img/3.jpg" alt="Deskripsi foto 3">
                </div>

                <p class="gallery-description">
                    I Like to taking a documentacion every my School event
                </p>

                <div class="row row-4">
                    <img src="img/4.jpg" alt="Deskripsi foto 4">
                    <img src="img/5.jpg" alt="Deskripsi foto 5">
                    <img src="img/6.jpg" alt="Deskripsi foto 6">
                    <img src="img/7.JPG" alt="Deskripsi foto 7">
                </div>

                <div class="row row-2">
                    <img src="img/8.JPG" alt="Deskripsi foto 8">
                    <img src="img/9.JPG" alt="Deskripsi foto 9">
                </div>

                <div class="row row-4">
                    <img src="img/10.JPG" alt="Deskripsi foto 10">
                    <img src="img/11.JPG" alt="Deskripsi foto 11">
                    <img src="img/12.JPG" alt="Deskripsi foto 12">
                    <img src="img/13.JPG" alt="Deskripsi foto 13">
                </div>

                <div class="row row-4 green-effect">
                    <img src="img/14.JPG" alt="Deskripsi foto 14">
                    <img src="img/15.JPG" alt="Deskripsi foto 15">
                    <img src="img/16.JPG" alt="Deskripsi foto 16">
                    <img src="img/17.JPG" alt="Deskripsi foto 17">
                </div>
                
                </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Need a Videographer, Photographer, or Graphic Designer?</p>
            <a href="#" class="cta-button">Let's Work Together</a>
        </div>
    </footer>

</body>
</html>
